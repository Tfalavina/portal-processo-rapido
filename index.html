<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Processo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #16324f;
    --azul-escuro: #0d1f33;
    --laranja: #e8752b;
    --laranja-escuro: #c85f1c;
    --papel: #ffffff;
    --fundo-secao: #f5f7fa;
    --texto: #1c2b3a;
    --texto-claro: #5b6b7c;
    --borda: #e2e6ec;
    --erro: #c0392b;
    --sucesso: #2f7d4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: transparent;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--texto);
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--azul), var(--laranja));
  }
  .conteudo { padding: 28px 26px 26px; }

  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--azul);
  }
  h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-claro);
    margin: 22px 0 12px;
  }
  h2:first-of-type { margin-top: 4px; }
  .subtitulo {
    font-size: 13.5px;
    color: var(--texto-claro);
    margin: 0 0 20px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--texto);
    margin: 12px 0 5px;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--borda);
    border-radius: 6px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--fundo-secao);
    color: var(--texto);
  }
  input:focus {
    outline: none;
    border-color: var(--azul);
    background: #fff;
  }
  .linha-dupla { display: flex; gap: 10px; }
  .linha-dupla > div { flex: 1; }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: var(--laranja);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--laranja-escuro); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secundario {
    background: transparent;
    color: var(--azul);
    border: 1px solid var(--borda);
  }
  button.secundario:hover:not(:disabled) { background: var(--fundo-secao); }

  .metodo-tabs {
    display: flex;
    gap: 10px;
  }
  .tab-metodo {
    width: auto;
    flex: 1;
    margin: 0;
    padding: 14px 10px;
    background: var(--fundo-secao);
    color: var(--texto);
    border: 1.5px solid var(--borda);
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .tab-metodo svg { width: 22px; height: 22px; }
  .tab-metodo.ativo {
    border-color: var(--azul);
    background: #eef3f8;
    color: var(--azul);
  }

  .valor-selo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fdf1e8;
    border: 1px solid #f3d5b8;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--laranja-escuro);
    margin-bottom: 4px;
  }

  .qrcode-box { text-align: center; margin: 16px 0; }
  .qrcode-box img { width: 180px; height: 180px; border: 1px solid var(--borda); border-radius: 6px; }

  .copia-cola { display: flex; gap: 8px; margin-top: 10px; }
  .copia-cola input { font-size: 11.5px; }
  .copia-cola button { width: auto; margin: 0; padding: 0 16px; white-space: nowrap; }

  .status-linha {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--texto-claro);
    margin-top: 18px;
    padding: 12px;
    background: var(--fundo-secao);
    border-radius: 6px;
  }
  .ponto-pulsante {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--laranja);
    animation: pulsar 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulsar {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  .mensagem-erro {
    font-size: 13px;
    color: var(--erro);
    background: #fdecea;
    border: 1px solid #f5c6c0;
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 12px;
  }

  .confirmado-linha {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--sucesso);
    font-weight: 700;
    margin-bottom: 4px;
  }

  hr.divisor { border: none; border-top: 1px solid var(--borda); margin: 20px 0; }

  .concluido { text-align: center; padding: 4px 0; }
  .concluido .icone {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--sucesso);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin: 0 auto 12px;
  }
  .concluido button { background: var(--sucesso); }
  .concluido button:hover { background: #256a41; }
</style>
</head>
<body>

<div class="card"><div class="conteudo" id="app">
  <!-- o conteúdo é montado via JS conforme o estado avança -->
</div></div>

<script>
const FUNCTIONS_URL = "https://dwckajtqbvltcatzycej.supabase.co/functions/v1";
const VALOR_CREDITO = "R$ 8,00";

const ICONE_CARTAO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>';
const ICONE_PIX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 L22 12 L12 22 L2 12 Z"/><circle cx="12" cy="12" r="3.2"/></svg>';

const app = document.getElementById("app");
let pedidoId = null;
let emailAtual = null;
let poller = null;
let pagamentoTratado = false;
let metodoEscolhido = "pix";

function render(html) { app.innerHTML = html; }

// ---------- Página 1: dados pessoais + pagamento (Pix ou Cartão, tudo aqui) ----------
function telaFormulario(erro) {
  render(`
    <h1>Buscar um processo</h1>
    <p class="subtitulo">Preencha seus dados e escolha como prefere pagar.</p>
    <div class="valor-selo">◆ Crédito avulso — ${VALOR_CREDITO}</div>

    <h2>Informações pessoais</h2>
    <label for="nome">Nome completo</label>
    <input id="nome" placeholder="Seu nome completo" />
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" />
    <label for="telefone">Telefone</label>
    <input id="telefone" placeholder="(00) 00000-0000" inputmode="numeric" />

    <h2>Método de pagamento</h2>
    <div class="metodo-tabs">
      <button type="button" class="tab-metodo ativo" id="tabCartao">${ICONE_CARTAO}Cartão</button>
      <button type="button" class="tab-metodo" id="tabPix">${ICONE_PIX}Pix</button>
    </div>

    <div id="camposMetodo"></div>

    <div id="erroArea">${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}</div>

    <button id="btnPagar">Pagar — ${VALOR_CREDITO}</button>

    <button type="button" id="linkMeusPedidos" class="secundario" style="margin-top:10px;font-size:13px;padding:9px;">Consultar processos finalizados</button>
  `);

  document.getElementById("tabCartao").onclick = () => selecionarMetodo("cartao");
  document.getElementById("tabPix").onclick = () => selecionarMetodo("pix");
  document.getElementById("btnPagar").onclick = pagar;
  document.getElementById("linkMeusPedidos").onclick = () => telaMeusPedidosEmail();

  metodoEscolhido = "cartao";
  renderCamposMetodo();
}

function selecionarMetodo(metodo) {
  metodoEscolhido = metodo;
  document.getElementById("tabCartao").classList.toggle("ativo", metodo === "cartao");
  document.getElementById("tabPix").classList.toggle("ativo", metodo === "pix");
  renderCamposMetodo();
}

function renderCamposMetodo() {
  const area = document.getElementById("camposMetodo");
  if (metodoEscolhido === "cartao") {
    area.innerHTML = `
      <label for="numeroCartao">Número do cartão</label>
      <input id="numeroCartao" placeholder="1234 1234 1234 1234" inputmode="numeric" />
      <div class="linha-dupla">
        <div>
          <label for="validade">Validade (MM/AA)</label>
          <input id="validade" placeholder="MM/AA" />
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input id="cvv" placeholder="123" inputmode="numeric" />
        </div>
      </div>
      <label for="titular">Titular do cartão</label>
      <input id="titular" placeholder="Nome como está no cartão" />
      <label for="documentoTitular">CPF/CNPJ do titular</label>
      <input id="documentoTitular" placeholder="Somente números" inputmode="numeric" />
      <div class="linha-dupla">
        <div>
          <label for="cep">CEP</label>
          <input id="cep" placeholder="00000-000" inputmode="numeric" />
          <div id="enderecoEncontrado" style="font-size:11.5px;color:var(--texto-claro);margin-top:4px;"></div>
        </div>
        <div>
          <label for="numeroEndereco">Número</label>
          <input id="numeroEndereco" placeholder="Nº" inputmode="numeric" />
        </div>
      </div>
    `;
    const campoCep = document.getElementById("cep");
    campoCep.addEventListener("blur", async () => {
      const cepLimpo = campoCep.value.replace(/\D/g, "");
      const alvo = document.getElementById("enderecoEncontrado");
      if (cepLimpo.length !== 8) { alvo.textContent = ""; return; }
      try {
        const res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
        const dados = await res.json();
        alvo.textContent = dados.erro ? "CEP não encontrado — confira e tente de novo." : `${dados.logradouro}, ${dados.bairro} — ${dados.localidade}/${dados.uf}`;
      } catch (e) {
        alvo.textContent = "";
      }
    });
  } else {
    area.innerHTML = `
      <label for="cpf">CPF</label>
      <input id="cpf" placeholder="Somente números" inputmode="numeric" />
    `;
  }
}

async function pagar() {
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefone = document.getElementById("telefone").value.trim();

  if (!nome || !email) {
    telaFormulario("Preencha nome e e-mail para continuar.");
    return;
  }

  const btn = document.getElementById("btnPagar");
  btn.disabled = true;

  if (metodoEscolhido === "pix") {
    const cpf = document.getElementById("cpf").value.trim();
    if (!cpf) { telaFormulario("Informe o CPF para continuar."); return; }

    btn.textContent = "Gerando cobrança...";
    try {
      const res = await fetch(`${FUNCTIONS_URL}/criar-cobranca`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, cpf }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Falha ao gerar cobrança");

      pedidoId = dados.pedido_id;
      emailAtual = email;
      mostrarQrCode(dados.qrcode_base64, dados.copia_e_cola);
      iniciarPolling();
    } catch (e) {
      telaFormulario(e.message);
    }
  } else {
    const numeroCartao = document.getElementById("numeroCartao").value.trim();
    const validade = document.getElementById("validade").value.trim();
    const cvv = document.getElementById("cvv").value.trim();
    const titular = document.getElementById("titular").value.trim();
    const documentoTitular = document.getElementById("documentoTitular").value.trim();
    const cep = document.getElementById("cep").value.trim();
    const numeroEndereco = document.getElementById("numeroEndereco").value.trim();

    if (!numeroCartao || !validade || !cvv || !titular || !documentoTitular || !cep || !numeroEndereco) {
      telaFormulario("Preencha todos os campos do cartão.");
      return;
    }

    btn.textContent = "Processando pagamento...";
    try {
      const res = await fetch(`${FUNCTIONS_URL}/pagar-cartao`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nome, email, telefone,
          numeroCartao, validade, cvv, titular, documentoTitular,
          cep, numeroEndereco,
          cpf: documentoTitular,
        }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Pagamento recusado.");

      pedidoId = dados.pedido_id;
      emailAtual = email;
      pagamentoTratado = true;
      await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pedido_id: pedidoId }),
      });
      telaPosPagamento();
    } catch (e) {
      telaFormulario(e.message);
    }
  }
}

function mostrarQrCode(qr, copiaCola) {
  render(`
    <h1>Pague com Pix</h1>
    <p class="subtitulo">Escaneie o QR Code ou use o código copia-e-cola no app do seu banco.</p>
    <div class="qrcode-box"><img src="data:image/png;base64,${qr}" alt="QR Code Pix" /></div>
    <label for="copiaCola">Pix copia e cola</label>
    <div class="copia-cola">
      <input id="copiaCola" readonly value="${copiaCola}" />
      <button id="btnCopiar">Copiar</button>
    </div>
    <div class="status-linha">
      <span class="ponto-pulsante"></span>
      Aguardando confirmação do pagamento...
    </div>
  `);
  document.getElementById("btnCopiar").onclick = () => {
    navigator.clipboard.writeText(copiaCola);
    const b = document.getElementById("btnCopiar");
    b.textContent = "Copiado!";
    setTimeout(() => (b.textContent = "Copiar"), 1800);
  };
}

// ---------- Página 2: confirmar e-mail + buscar processo (uma tela só) ----------
function telaPosPagamento() {
  render(`
    <h1>Confirme seu e-mail</h1>
    <p class="subtitulo">Enviamos um código de 6 dígitos para <strong id="emailExibido">${emailAtual}</strong>. Isso evita que o crédito seja perdido caso o e-mail digitado esteja errado.</p>

    <label for="codigo">Código de confirmação</label>
    <input id="codigo" inputmode="numeric" maxlength="6" placeholder="000000" />
    <div id="erroCodigo"></div>
    <button id="btnConfirmarCodigo">Confirmar código</button>
    <div style="text-align:center;margin-top:14px;">
      <a href="#" id="linkReenviar" style="font-size:12.5px;color:var(--texto-claro);">Reenviar código</a>
      &nbsp;·&nbsp;
      <a href="#" id="linkCorrigirEmail" style="font-size:12.5px;color:var(--texto-claro);">Não é esse o seu e-mail?</a>
    </div>
    <div id="areaCorrigirEmail"></div>
    <div id="areaProcesso"></div>
  `);

  document.getElementById("btnConfirmarCodigo").onclick = confirmarCodigo;
  document.getElementById("linkReenviar").onclick = async (e) => {
    e.preventDefault();
    await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pedido_id: pedidoId }),
    });
    document.getElementById("erroCodigo").innerHTML = `<div class="mensagem-erro">Reenviamos o código — confira sua caixa de entrada.</div>`;
  };
  document.getElementById("linkCorrigirEmail").onclick = (e) => {
    e.preventDefault();
    document.getElementById("areaCorrigirEmail").innerHTML = `
      <label for="emailCorrigido">Digite o e-mail correto</label>
      <input id="emailCorrigido" type="email" placeholder="seu@email.com" value="${emailAtual}" />
      <button id="btnReenviarNovoEmail" class="secundario">Enviar código pra esse e-mail</button>
    `;
    document.getElementById("btnReenviarNovoEmail").onclick = async () => {
      const novoEmail = document.getElementById("emailCorrigido").value.trim();
      if (!novoEmail) return;
      const btn = document.getElementById("btnReenviarNovoEmail");
      btn.disabled = true;
      btn.textContent = "Enviando...";
      try {
        const res = await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pedido_id: pedidoId, novo_email: novoEmail }),
        });
        const dados = await res.json();
        if (!res.ok) throw new Error(dados.erro || "Não foi possível trocar o e-mail.");
        emailAtual = dados.email || novoEmail;
        document.getElementById("emailExibido").textContent = emailAtual;
        document.getElementById("areaCorrigirEmail").innerHTML = "";
        document.getElementById("erroCodigo").innerHTML = `<div class="mensagem-erro">Código enviado pro novo e-mail — confira a caixa de entrada.</div>`;
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "Enviar código pra esse e-mail";
        document.getElementById("areaCorrigirEmail").innerHTML += `<div class="mensagem-erro">${e.message}</div>`;
      }
    };
  };
}

async function confirmarCodigo() {
  const codigo = document.getElementById("codigo").value.trim();
  const btn = document.getElementById("btnConfirmarCodigo");
  btn.disabled = true;
  btn.textContent = "Confirmando...";

  try {
    const res = await fetch(`${FUNCTIONS_URL}/confirmar-codigo`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pedido_id: pedidoId, codigo }),
    });
    const dados = await res.json();
    if (!res.ok) throw new Error(dados.erro || "Código incorreto");

    document.getElementById("codigo").disabled = true;
    document.getElementById("btnConfirmarCodigo").style.display = "none";
    document.getElementById("linkReenviar").parentElement.style.display = "none";
    document.getElementById("areaCorrigirEmail").innerHTML = "";
    document.getElementById("erroCodigo").innerHTML = `<div class="confirmado-linha">✓ E-mail confirmado</div>`;

    document.getElementById("areaProcesso").innerHTML = `
      <hr class="divisor" />
      <label for="numeroProcesso">Número do processo</label>
      <input id="numeroProcesso" placeholder="0000000-00.0000.0.00.0000" />
      <div id="erroProcesso"></div>
      <button id="btnSolicitar">Solicitar processo</button>
    `;
    document.getElementById("btnSolicitar").onclick = solicitarProcesso;
  } catch (e) {
    document.getElementById("erroCodigo").innerHTML = `<div class="mensagem-erro">${e.message}</div>`;
    btn.disabled = false;
    btn.textContent = "Confirmar código";
  }
}

async function solicitarProcesso() {
  const numero = document.getElementById("numeroProcesso").value.trim();
  if (!numero) {
    document.getElementById("erroProcesso").innerHTML = `<div class="mensagem-erro">Informe o número do processo.</div>`;
    return;
  }

  const btn = document.getElementById("btnSolicitar");
  btn.disabled = true;
  btn.textContent = "Enviando...";

  try {
    const res = await fetch(`${FUNCTIONS_URL}/solicitar-processo`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pedido_id: pedidoId, numero_processo: numero }),
    });
    const dados = await res.json();
    if (!res.ok) throw new Error(dados.erro || "Falha ao solicitar processo");

    document.getElementById("areaProcesso").innerHTML = `
      <hr class="divisor" />
      <div class="status-linha">
        <span class="ponto-pulsante"></span>
        Buscando o processo... isso costuma levar poucos minutos, podendo levar até algumas horas em casos mais raros. Assim que ficar pronto, o PDF aparece aqui automaticamente — e você também recebe um e-mail com o link, então pode fechar esta aba sem problema.
      </div>
    `;
    iniciarPolling();
  } catch (e) {
    document.getElementById("erroProcesso").innerHTML = `<div class="mensagem-erro">${e.message}</div>`;
    btn.disabled = false;
    btn.textContent = "Solicitar processo";
  }
}

function telaConcluida(pdfUrl) {
  clearInterval(poller);
  render(`
    <div class="concluido">
      <div class="icone">✓</div>
      <h1>Processo pronto</h1>
      <p class="subtitulo">Seu documento já pode ser baixado.</p>
      <a href="${pdfUrl}" target="_blank" rel="noopener"><button>Baixar PDF</button></a>
    </div>
  `);
}

function iniciarPolling() {
  clearInterval(poller);
  poller = setInterval(async () => {
    try {
      const res = await fetch(`${FUNCTIONS_URL}/status-pedido?pedido_id=${pedidoId}`);
      const dados = await res.json();

      if (dados.status === "pago" && !pagamentoTratado) {
        pagamentoTratado = true;
        clearInterval(poller);
        await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pedido_id: pedidoId }),
        });
        telaPosPagamento();
      } else if (dados.status === "concluido") {
        telaConcluida(dados.pdf_url);
      } else if (dados.status === "erro") {
        clearInterval(poller);
        const alvo = document.getElementById("erroProcesso") || document.getElementById("erroArea");
        if (alvo) alvo.innerHTML = `<div class="mensagem-erro">${dados.erro_msg || "Não foi possível concluir a consulta. Fale com o suporte."}</div>`;
      }
    } catch (e) {
      // silencioso: só tenta de novo no próximo ciclo
    }
  }, 4000);
}

// ---------- Avisa o iframe pai (Cademi) do tamanho real da página ----------
function enviarAltura() {
  window.parent.postMessage({ tipo: "portal-processo-altura", altura: document.body.scrollHeight }, "*");
}
new ResizeObserver(enviarAltura).observe(document.body);
window.addEventListener("load", enviarAltura);

// ---------- Consultar meus processos (pedidos antigos) ----------
function telaMeusPedidosEmail(erro) {
  render(`
    <h1>Consultar meus processos</h1>
    <p class="subtitulo">Informe o e-mail usado na compra para receber um código de acesso.</p>
    <label for="emailConsulta">E-mail</label>
    <input id="emailConsulta" type="email" placeholder="seu@email.com" />
    ${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}
    <button id="btnEnviarCodigoConsulta">Enviar código</button>
    <div style="text-align:center;margin-top:14px;">
      <a href="#" id="linkVoltar" style="font-size:12.5px;color:var(--texto-claro);">Voltar</a>
    </div>
  `);
  document.getElementById("linkVoltar").onclick = (e) => { e.preventDefault(); telaFormulario(); };
  document.getElementById("btnEnviarCodigoConsulta").onclick = async () => {
    const email = document.getElementById("emailConsulta").value.trim();
    if (!email) { telaMeusPedidosEmail("Informe o e-mail."); return; }
    try {
      const res = await fetch(`${FUNCTIONS_URL}/meus-pedidos-solicitar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Não foi possível enviar o código.");
      telaMeusPedidosCodigo(email);
    } catch (e) {
      telaMeusPedidosEmail(e.message);
    }
  };
}

function telaMeusPedidosCodigo(email, erro) {
  render(`
    <h1>Digite o código</h1>
    <p class="subtitulo">Enviamos um código para <strong>${email}</strong>.</p>
    <label for="codigoConsulta">Código</label>
    <input id="codigoConsulta" inputmode="numeric" maxlength="6" placeholder="000000" />
    ${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}
    <button id="btnConfirmarConsulta">Ver meus processos</button>
  `);
  document.getElementById("btnConfirmarConsulta").onclick = async () => {
    const codigo = document.getElementById("codigoConsulta").value.trim();
    try {
      const res = await fetch(`${FUNCTIONS_URL}/meus-pedidos-confirmar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, codigo }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Código incorreto.");
      telaListaPedidos(dados.pedidos);
    } catch (e) {
      telaMeusPedidosCodigo(email, e.message);
    }
  };
}

function telaListaPedidos(pedidos) {
  const linhas = pedidos.length
    ? pedidos.map((p) => `
        <div class="status-linha" style="justify-content:space-between;">
          <span>${p.numero_processo ?? "—"}</span>
          ${p.status === "concluido"
            ? `<a href="${p.pdf_url}" target="_blank" rel="noopener">Baixar PDF</a>`
            : `<span style="color:var(--laranja-escuro);">${p.status.replace("_", " ")}</span>`}
        </div>`).join("")
    : `<p class="subtitulo">Nenhum pedido encontrado para esse e-mail.</p>`;

  render(`
    <h1>Meus processos</h1>
    ${linhas}
    <div style="text-align:center;margin-top:18px;">
      <a href="#" id="linkVoltarLista" style="font-size:12.5px;color:var(--texto-claro);">Voltar ao início</a>
    </div>
  `);
  document.getElementById("linkVoltarLista").onclick = (e) => { e.preventDefault(); telaFormulario(); };
}

telaFormulario();
</script>

</body>
</html>

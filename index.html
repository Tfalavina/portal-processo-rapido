<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Processo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #4d8fc9;
    --azul-escuro: #16324f;
    --laranja: #e8752b;
    --laranja-escuro: #f2914f;
    --papel: #17181c;
    --fundo-secao: #212227;
    --texto: #f2f0ea;
    --texto-claro: #9a9fa8;
    --borda: #34363c;
    --erro: #ff8a80;
    --erro-bg: #3a1f1d;
    --erro-borda: #5c2b27;
    --sucesso: #6fd0a0;
    --sucesso-bg: #163a2b;
  }
  html { background: #0b0b0a; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: #0b0b0a;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--texto);
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--papel);
    border: 1px solid var(--borda);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--azul), var(--laranja));
  }
  .conteudo { padding: 28px 26px 26px; }

  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--azul);
  }
  h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-claro);
    margin: 22px 0 12px;
  }
  h2:first-of-type { margin-top: 4px; }
  .subtitulo {
    font-size: 13.5px;
    color: var(--texto-claro);
    margin: 0 0 20px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--texto);
    margin: 12px 0 5px;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--borda);
    border-radius: 6px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--fundo-secao);
    color: var(--texto);
  }
  input:focus {
    outline: none;
    border-color: var(--azul);
    background: #26282e;
  }
  .linha-dupla { display: flex; gap: 10px; }
  .linha-dupla > div { flex: 1; }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: var(--laranja);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--laranja-escuro); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.secundario {
    background: transparent;
    color: var(--azul);
    border: 1px solid var(--borda);
  }
  button.secundario:hover:not(:disabled) { background: var(--fundo-secao); }

  .metodo-tabs {
    display: flex;
    gap: 10px;
  }
  .tab-metodo {
    width: auto;
    flex: 1;
    margin: 0;
    padding: 14px 10px;
    background: var(--fundo-secao);
    color: var(--texto);
    border: 1.5px solid var(--borda);
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .tab-metodo svg { width: 22px; height: 22px; }
  .tab-metodo.ativo {
    border-color: var(--azul);
    background: rgba(77, 143, 201, 0.14);
    color: var(--azul);
  }

  .valor-selo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(232, 117, 43, 0.14);
    border: 1px solid rgba(232, 117, 43, 0.4);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--laranja-escuro);
    margin-bottom: 4px;
  }

  .qrcode-box { text-align: center; margin: 16px 0; }
  .qrcode-box img { width: 180px; height: 180px; border: 1px solid var(--borda); border-radius: 6px; }

  .copia-cola { display: flex; gap: 8px; margin-top: 10px; }
  .copia-cola input { font-size: 11.5px; }
  .copia-cola button { width: auto; margin: 0; padding: 0 16px; white-space: nowrap; }

  .status-linha {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--texto-claro);
    margin-top: 18px;
    padding: 12px;
    background: var(--fundo-secao);
    border-radius: 6px;
  }
  .ponto-pulsante {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--laranja);
    animation: pulsar 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulsar {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  .mensagem-erro {
    font-size: 13px;
    color: var(--erro);
    background: var(--erro-bg);
    border: 1px solid var(--erro-borda);
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 12px;
  }

  .confirmado-linha {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--sucesso);
    font-weight: 700;
    margin-bottom: 4px;
  }

  hr.divisor { border: none; border-top: 1px solid var(--borda); margin: 20px 0; }

  .pacotes { display: flex; gap: 8px; }
  .pacote {
    width: auto;
    flex: 1;
    margin: 0;
    padding: 12px 6px;
    background: var(--fundo-secao);
    color: var(--texto);
    border: 1.5px solid var(--borda);
    border-radius: 8px;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
  }
  .pacote .qtd { display: block; font-size: 15px; font-weight: 700; }
  .pacote .preco { display: block; font-size: 12.5px; color: var(--texto-claro); margin-top: 2px; }
  .pacote.ativo {
    border-color: var(--laranja);
    background: rgba(232, 117, 43, 0.14);
  }
  .pacote.ativo .qtd { color: var(--laranja); }

  .saldo-badge {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(111, 208, 160, 0.12);
    border: 1px solid rgba(111, 208, 160, 0.35);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13.5px;
  }
  .saldo-badge strong { color: var(--sucesso); font-size: 16px; }

  .concluido { text-align: center; padding: 4px 0; }
  .concluido .icone {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--sucesso);
    color: #0d1f17;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin: 0 auto 12px;
  }
  .concluido button { background: var(--sucesso); color: #0d1f17; }
  .concluido button:hover { background: #8adcb6; }
</style>
</head>
<body>

<div class="card"><div class="conteudo" id="app">
  <!-- o conteúdo é montado via JS conforme o estado avança -->
</div></div>

<script>
const FUNCTIONS_URL = "https://dwckajtqbvltcatzycej.supabase.co/functions/v1";

const PACOTES = {
  1: { preco: "R$ 9,00", label: "1 crédito" },
  5: { preco: "R$ 40,00", label: "5 créditos" },
  10: { preco: "R$ 75,00", label: "10 créditos" },
};

const ICONE_CARTAO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>';
const ICONE_PIX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 L22 12 L12 22 L2 12 Z"/><circle cx="12" cy="12" r="3.2"/></svg>';

const app = document.getElementById("app");
let pedidoId = null;
let consultaId = null;
let emailAtual = null;
let poller = null;
let metodoEscolhido = "cartao";
let pacoteEscolhido = 5;

function render(html) { app.innerHTML = html; }

// ---------- Página 1: dados pessoais + pacote + pagamento (tudo aqui) ----------
function telaFormulario(erro) {
  render(`
    <h1>Comprar créditos</h1>
    <p class="subtitulo">Escolha a quantidade e preencha seus dados para continuar.</p>

    <h2>Quantidade de créditos</h2>
    <div class="pacotes">
      <button type="button" class="pacote" data-qtd="1"><span class="qtd">1</span><span class="preco">${PACOTES[1].preco}</span></button>
      <button type="button" class="pacote ativo" data-qtd="5"><span class="qtd">5</span><span class="preco">${PACOTES[5].preco}</span></button>
      <button type="button" class="pacote" data-qtd="10"><span class="qtd">10</span><span class="preco">${PACOTES[10].preco}</span></button>
    </div>

    <h2>Informações pessoais</h2>
    <label for="nome">Nome completo</label>
    <input id="nome" placeholder="Seu nome completo" />
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" />
    <label for="telefone">Telefone</label>
    <input id="telefone" placeholder="(00) 00000-0000" inputmode="numeric" />

    <h2>Método de pagamento</h2>
    <div class="metodo-tabs">
      <button type="button" class="tab-metodo ativo" id="tabCartao">${ICONE_CARTAO}Cartão</button>
      <button type="button" class="tab-metodo" id="tabPix">${ICONE_PIX}Pix</button>
    </div>

    <div id="camposMetodo"></div>

    <div id="erroArea">${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}</div>

    <button id="btnPagar">Pagar — ${PACOTES[pacoteEscolhido].preco}</button>

    <button type="button" id="linkMeusPedidos" class="secundario" style="margin-top:10px;font-size:13px;padding:9px;">Consultar meus créditos</button>
  `);

  pacoteEscolhido = 5;
  document.querySelectorAll(".pacote").forEach((btn) => {
    btn.onclick = () => {
      pacoteEscolhido = Number(btn.dataset.qtd);
      document.querySelectorAll(".pacote").forEach((b) => b.classList.toggle("ativo", b === btn));
      document.getElementById("btnPagar").textContent = `Pagar — ${PACOTES[pacoteEscolhido].preco}`;
    };
  });

  document.getElementById("tabCartao").onclick = () => selecionarMetodo("cartao");
  document.getElementById("tabPix").onclick = () => selecionarMetodo("pix");
  document.getElementById("btnPagar").onclick = pagar;
  document.getElementById("linkMeusPedidos").onclick = () => telaMeusPedidosEmail();

  metodoEscolhido = "cartao";
  renderCamposMetodo();
}

function selecionarMetodo(metodo) {
  metodoEscolhido = metodo;
  document.getElementById("tabCartao").classList.toggle("ativo", metodo === "cartao");
  document.getElementById("tabPix").classList.toggle("ativo", metodo === "pix");
  renderCamposMetodo();
}

function renderCamposMetodo() {
  const area = document.getElementById("camposMetodo");
  if (metodoEscolhido === "cartao") {
    area.innerHTML = `
      <label for="numeroCartao">Número do cartão</label>
      <input id="numeroCartao" placeholder="1234 1234 1234 1234" inputmode="numeric" />
      <div class="linha-dupla">
        <div>
          <label for="validade">Validade (MM/AA)</label>
          <input id="validade" placeholder="MM/AA" />
        </div>
        <div>
          <label for="cvv">CVV</label>
          <input id="cvv" placeholder="123" inputmode="numeric" />
        </div>
      </div>
      <label for="titular">Titular do cartão</label>
      <input id="titular" placeholder="Nome como está no cartão" />
      <label for="documentoTitular">CPF/CNPJ do titular</label>
      <input id="documentoTitular" placeholder="Somente números" inputmode="numeric" />
      <div class="linha-dupla">
        <div>
          <label for="cep">CEP</label>
          <input id="cep" placeholder="00000-000" inputmode="numeric" />
          <div id="enderecoEncontrado" style="font-size:11.5px;color:var(--texto-claro);margin-top:4px;"></div>
        </div>
        <div>
          <label for="numeroEndereco">Número</label>
          <input id="numeroEndereco" placeholder="Nº" inputmode="numeric" />
        </div>
      </div>
    `;
    const campoCep = document.getElementById("cep");
    campoCep.addEventListener("blur", async () => {
      const cepLimpo = campoCep.value.replace(/\D/g, "");
      const alvo = document.getElementById("enderecoEncontrado");
      if (cepLimpo.length !== 8) { alvo.textContent = ""; return; }
      try {
        const res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
        const dados = await res.json();
        alvo.textContent = dados.erro ? "CEP não encontrado — confira e tente de novo." : `${dados.logradouro}, ${dados.bairro} — ${dados.localidade}/${dados.uf}`;
      } catch (e) {
        alvo.textContent = "";
      }
    });
  } else {
    area.innerHTML = `
      <label for="cpf">CPF</label>
      <input id="cpf" placeholder="Somente números" inputmode="numeric" />
    `;
  }
}

async function pagar() {
  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const telefone = document.getElementById("telefone").value.trim();

  if (!nome || !email) {
    telaFormulario("Preencha nome e e-mail para continuar.");
    return;
  }

  const btn = document.getElementById("btnPagar");
  btn.disabled = true;

  if (metodoEscolhido === "pix") {
    const cpf = document.getElementById("cpf").value.trim();
    if (!cpf) { telaFormulario("Informe o CPF para continuar."); return; }

    btn.textContent = "Gerando cobrança...";
    try {
      const res = await fetch(`${FUNCTIONS_URL}/criar-cobranca`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, telefone, cpf, quantidade: pacoteEscolhido }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Falha ao gerar cobrança");

      pedidoId = dados.pedido_id;
      emailAtual = email;
      mostrarQrCode(dados.qrcode_base64, dados.copia_e_cola);
      iniciarPollingPagamento();
    } catch (e) {
      telaFormulario(e.message);
    }
  } else {
    const numeroCartao = document.getElementById("numeroCartao").value.trim();
    const validade = document.getElementById("validade").value.trim();
    const cvv = document.getElementById("cvv").value.trim();
    const titular = document.getElementById("titular").value.trim();
    const documentoTitular = document.getElementById("documentoTitular").value.trim();
    const cep = document.getElementById("cep").value.trim();
    const numeroEndereco = document.getElementById("numeroEndereco").value.trim();

    if (!numeroCartao || !validade || !cvv || !titular || !documentoTitular || !cep || !numeroEndereco) {
      telaFormulario("Preencha todos os campos do cartão.");
      return;
    }

    btn.textContent = "Processando pagamento...";
    try {
      const res = await fetch(`${FUNCTIONS_URL}/pagar-cartao`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nome, email, telefone, quantidade: pacoteEscolhido,
          numeroCartao, validade, cvv, titular, documentoTitular,
          cep, numeroEndereco,
          cpf: documentoTitular,
        }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Pagamento recusado.");

      emailAtual = email;
      if (dados.email_confirmado) {
        telaBuscarProcesso(dados.saldo_creditos);
      } else {
        try {
          const resCodigo = await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          if (!resCodigo.ok) throw new Error();
          telaConfirmarEmail();
        } catch (_e) {
          telaConfirmarEmail("Não conseguimos enviar o código agora — clique em \"Reenviar código\" para tentar de novo.");
        }
      }
    } catch (e) {
      telaFormulario(e.message);
    }
  }
}

function mostrarQrCode(qr, copiaCola) {
  render(`
    <h1>Pague com Pix</h1>
    <p class="subtitulo">Escaneie o QR Code ou use o código copia-e-cola no app do seu banco.</p>
    <div class="qrcode-box"><img src="data:image/png;base64,${qr}" alt="QR Code Pix" /></div>
    <label for="copiaCola">Pix copia e cola</label>
    <div class="copia-cola">
      <input id="copiaCola" readonly value="${copiaCola}" />
      <button id="btnCopiar">Copiar</button>
    </div>
    <div class="status-linha">
      <span class="ponto-pulsante"></span>
      Aguardando confirmação do pagamento...
    </div>
  `);
  document.getElementById("btnCopiar").onclick = () => {
    navigator.clipboard.writeText(copiaCola);
    const b = document.getElementById("btnCopiar");
    b.textContent = "Copiado!";
    setTimeout(() => (b.textContent = "Copiar"), 1800);
  };
}

function iniciarPollingPagamento() {
  clearInterval(poller);
  poller = setInterval(async () => {
    try {
      const res = await fetch(`${FUNCTIONS_URL}/status-pagamento?pedido_id=${pedidoId}`);
      const dados = await res.json();
      if (dados.status === "pago") {
        clearInterval(poller);
        if (dados.email_confirmado) {
          telaBuscarProcesso(dados.saldo_creditos);
        } else {
          try {
            const resCodigo = await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: emailAtual }),
            });
            if (!resCodigo.ok) throw new Error();
            telaConfirmarEmail();
          } catch (_e) {
            telaConfirmarEmail("Não conseguimos enviar o código agora — clique em \"Reenviar código\" para tentar de novo.");
          }
        }
      }
    } catch (e) {
      // silencioso: só tenta de novo no próximo ciclo
    }
  }, 4000);
}

// ---------- Confirmação de e-mail (só na primeira compra de cada e-mail) ----------
function telaConfirmarEmail(erro) {
  render(`
    <h1>Confirme seu e-mail</h1>
    <p class="subtitulo">Enviamos um código de 6 dígitos para <strong>${emailAtual}</strong>. É só dessa vez — nas próximas compras esse passo não aparece mais.</p>

    <label for="codigo">Código de confirmação</label>
    <input id="codigo" inputmode="numeric" maxlength="6" placeholder="000000" />
    <div id="erroCodigo">${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}</div>
    <button id="btnConfirmarCodigo">Confirmar código</button>
    <div style="text-align:center;margin-top:14px;">
      <a href="#" id="linkReenviar" style="font-size:12.5px;color:var(--texto-claro);">Reenviar código</a>
      &nbsp;·&nbsp;
      <a href="#" id="linkCorrigirEmail" style="font-size:12.5px;color:var(--texto-claro);">Não é esse o seu e-mail?</a>
    </div>
    <div id="areaCorrigirEmail"></div>
  `);

  document.getElementById("btnConfirmarCodigo").onclick = async () => {
    const codigo = document.getElementById("codigo").value.trim();
    const btn = document.getElementById("btnConfirmarCodigo");
    btn.disabled = true;
    btn.textContent = "Confirmando...";
    try {
      const res = await fetch(`${FUNCTIONS_URL}/confirmar-codigo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailAtual, codigo }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Código incorreto");
      telaBuscarProcesso(dados.saldo_creditos);
    } catch (e) {
      telaConfirmarEmail(e.message);
    }
  };

  document.getElementById("linkReenviar").onclick = async (e) => {
    e.preventDefault();
    try {
      const res = await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailAtual }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Não foi possível reenviar o código.");
      document.getElementById("erroCodigo").innerHTML = `<div class="mensagem-erro">Reenviamos o código — confira sua caixa de entrada.</div>`;
    } catch (e) {
      document.getElementById("erroCodigo").innerHTML = `<div class="mensagem-erro">${e.message}</div>`;
    }
  };

  document.getElementById("linkCorrigirEmail").onclick = (e) => {
    e.preventDefault();
    document.getElementById("areaCorrigirEmail").innerHTML = `
      <label for="emailCorrigido">Digite o e-mail correto</label>
      <input id="emailCorrigido" type="email" placeholder="seu@email.com" value="${emailAtual}" />
      <button id="btnReenviarNovoEmail" class="secundario">Enviar código pra esse e-mail</button>
    `;
    document.getElementById("btnReenviarNovoEmail").onclick = async () => {
      const novoEmail = document.getElementById("emailCorrigido").value.trim();
      if (!novoEmail) return;
      const btn = document.getElementById("btnReenviarNovoEmail");
      btn.disabled = true;
      btn.textContent = "Enviando...";
      try {
        const res = await fetch(`${FUNCTIONS_URL}/enviar-codigo`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailAtual, novo_email: novoEmail }),
        });
        const dados = await res.json();
        if (!res.ok) throw new Error(dados.erro || "Não foi possível trocar o e-mail.");
        emailAtual = dados.email || novoEmail;
        telaConfirmarEmail("Código enviado pro novo e-mail — confira a caixa de entrada.");
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "Enviar código pra esse e-mail";
        document.getElementById("areaCorrigirEmail").innerHTML += `<div class="mensagem-erro">${e.message}</div>`;
      }
    };
  };
}

// ---------- Página 2: saldo + buscar processo ----------
function telaBuscarProcesso(saldo, erro) {
  render(`
    <h1>Buscar processo</h1>
    <div class="saldo-badge">
      <span>Seu saldo</span>
      <strong>${saldo ?? "-"} crédito(s)</strong>
    </div>
    <label for="numeroProcesso">Número do processo</label>
    <input id="numeroProcesso" placeholder="0000000-00.0000.0.00.0000" />
    <div id="erroProcesso">${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}</div>
    <button id="btnSolicitar">Solicitar processo</button>
    <button type="button" id="linkMeusPedidos2" class="secundario" style="margin-top:10px;font-size:13px;padding:9px;">Consultar meus créditos</button>
  `);
  document.getElementById("btnSolicitar").onclick = solicitarProcesso;
  document.getElementById("linkMeusPedidos2").onclick = () => telaMeusPedidosEmail();
}

async function solicitarProcesso() {
  const numero = document.getElementById("numeroProcesso").value.trim();
  if (!numero) {
    document.getElementById("erroProcesso").innerHTML = `<div class="mensagem-erro">Informe o número do processo.</div>`;
    return;
  }

  const btn = document.getElementById("btnSolicitar");
  btn.disabled = true;
  btn.textContent = "Enviando...";

  try {
    const res = await fetch(`${FUNCTIONS_URL}/solicitar-processo`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: emailAtual, numero_processo: numero }),
    });
    const dados = await res.json();
    if (!res.ok) throw new Error(dados.erro || "Falha ao solicitar processo");

    consultaId = dados.consulta_id;
    telaAguardandoProcesso();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Solicitar processo";
    document.getElementById("erroProcesso").innerHTML = `<div class="mensagem-erro">${e.message}</div>`;
  }
}

function telaAguardandoProcesso() {
  render(`
    <h1>Buscando o processo</h1>
    <p class="subtitulo">Isso costuma levar poucos minutos, podendo levar até algumas horas em casos mais raros. Assim que ficar pronto, o PDF aparece aqui automaticamente — e você também recebe um e-mail com o link, então pode fechar esta aba sem problema.</p>
    <div class="status-linha">
      <span class="ponto-pulsante"></span>
      Buscando o processo...
    </div>
  `);
  iniciarPollingConsulta();
}

function telaConcluida(pdfUrl, saldo) {
  clearInterval(poller);
  render(`
    <div class="concluido">
      <div class="icone">✓</div>
      <h1>Processo pronto</h1>
      <p class="subtitulo">Seu documento já pode ser baixado.</p>
      <a href="${pdfUrl}" target="_blank" rel="noopener"><button>Baixar PDF</button></a>
      <button type="button" id="btnBuscarOutro" class="secundario">Buscar outro processo</button>
    </div>
  `);
  document.getElementById("btnBuscarOutro").onclick = () => telaBuscarProcesso(saldo);
}

function iniciarPollingConsulta() {
  clearInterval(poller);
  poller = setInterval(async () => {
    try {
      const res = await fetch(`${FUNCTIONS_URL}/status-pedido?consulta_id=${consultaId}&email=${encodeURIComponent(emailAtual)}`);
      const dados = await res.json();

      if (dados.status === "concluido") {
        clearInterval(poller);
        telaConcluida(dados.pdf_url, dados.saldo_creditos);
      } else if (dados.status === "erro") {
        clearInterval(poller);
        telaBuscarProcesso(dados.saldo_creditos, dados.erro_msg || "Não foi possível concluir a consulta. Fale com o suporte.");
      }
    } catch (e) {
      // silencioso: só tenta de novo no próximo ciclo
    }
  }, 4000);
}

// ---------- Avisa o iframe pai (Cademi) do tamanho real da página ----------
function enviarAltura() {
  window.parent.postMessage({ tipo: "portal-processo-altura", altura: document.body.scrollHeight }, "*");
}
new ResizeObserver(enviarAltura).observe(document.body);
window.addEventListener("load", enviarAltura);

// ---------- Consultar meus créditos (saldo + histórico) ----------
function telaMeusPedidosEmail(erro) {
  render(`
    <h1>Consultar meus créditos</h1>
    <p class="subtitulo">Informe o e-mail usado na compra para receber um código de acesso.</p>
    <label for="emailConsulta">E-mail</label>
    <input id="emailConsulta" type="email" placeholder="seu@email.com" />
    <div id="erroConsulta">${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}</div>
    <button id="btnEnviarCodigoConsulta">Enviar código</button>
    <div style="text-align:center;margin-top:14px;">
      <a href="#" id="linkVoltar" style="font-size:12.5px;color:var(--texto-claro);">Voltar</a>
    </div>
  `);
  document.getElementById("linkVoltar").onclick = (e) => { e.preventDefault(); telaFormulario(); };
  document.getElementById("btnEnviarCodigoConsulta").onclick = async () => {
    const email = document.getElementById("emailConsulta").value.trim();
    if (!email) { telaMeusPedidosEmail("Informe o e-mail."); return; }
    try {
      const res = await fetch(`${FUNCTIONS_URL}/meus-pedidos-solicitar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Não foi possível enviar o código.");
      telaMeusPedidosCodigo(email);
    } catch (e) {
      telaMeusPedidosEmail(e.message);
    }
  };
}

function telaMeusPedidosCodigo(email, erro) {
  render(`
    <h1>Digite o código</h1>
    <p class="subtitulo">Enviamos um código para <strong>${email}</strong>.</p>
    <label for="codigoConsulta">Código</label>
    <input id="codigoConsulta" inputmode="numeric" maxlength="6" placeholder="000000" />
    <div id="erroConsulta">${erro ? `<div class="mensagem-erro">${erro}</div>` : ""}</div>
    <button id="btnConfirmarConsulta">Ver meus créditos</button>
  `);
  document.getElementById("btnConfirmarConsulta").onclick = async () => {
    const codigo = document.getElementById("codigoConsulta").value.trim();
    try {
      const res = await fetch(`${FUNCTIONS_URL}/meus-pedidos-confirmar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, codigo }),
      });
      const dados = await res.json();
      if (!res.ok) throw new Error(dados.erro || "Código incorreto.");
      emailAtual = email;
      telaListaPedidos(dados.saldo_creditos, dados.consultas, email);
    } catch (e) {
      telaMeusPedidosCodigo(email, e.message);
    }
  };
}

function telaListaPedidos(saldo, consultas, emailConsulta) {
  const linhas = consultas.length
    ? consultas.map((c) => {
        let acao;
        if (c.status === "concluido") {
          acao = `<a href="${c.pdf_url}" target="_blank" rel="noopener">Baixar PDF</a>`;
        } else if (c.status === "em_processamento") {
          acao = `<button type="button" class="btn-continuar" data-id="${c.id}" style="width:auto;margin:0;padding:6px 14px;font-size:12.5px;">Acompanhar</button>`;
        } else {
          acao = `<span style="color:var(--laranja-escuro);">${String(c.status).replace("_", " ")}</span>`;
        }
        return `<div class="status-linha" style="justify-content:space-between;">
          <span>${c.numero_processo ?? "—"}</span>
          ${acao}
        </div>`;
      }).join("")
    : `<p class="subtitulo">Nenhuma consulta encontrada para esse e-mail.</p>`;

  render(`
    <h1>Meus créditos</h1>
    <div class="saldo-badge">
      <span>Saldo disponível</span>
      <strong>${saldo} crédito(s)</strong>
    </div>
    <button id="btnNovaConsulta">Buscar novo processo</button>
    <h2>Histórico</h2>
    ${linhas}
    <div style="text-align:center;margin-top:18px;">
      <a href="#" id="linkVoltarLista" style="font-size:12.5px;color:var(--texto-claro);">Voltar ao início</a>
    </div>
  `);
  document.getElementById("linkVoltarLista").onclick = (e) => { e.preventDefault(); telaFormulario(); };
  document.getElementById("btnNovaConsulta").onclick = () => telaBuscarProcesso(saldo);

  document.querySelectorAll(".btn-continuar").forEach((btn) => {
    btn.onclick = () => {
      consultaId = btn.dataset.id;
      emailAtual = emailConsulta;
      telaAguardandoProcesso();
    };
  });
}

telaFormulario();
</script>

</body>
</html>
